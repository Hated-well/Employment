<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — CoreStory Careers Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="admin-login-body">
  <div class="admin-login-wrap">
    <div class="admin-login-card">
      <div class="admin-login-header">
        <div class="admin-logo">
          <div class="logo-icon">CS</div>
          <div class="logo-text">Core<span>Story</span></div>
        </div>
        <h1>Admin Dashboard</h1>
        <p class="admin-login-sub">Secure access — Careers Management System</p>
      </div>

      <form id="loginForm" novalidate>
        <div id="loginError" class="alert alert-error"></div>

        <div class="admin-form-group">
          <label for="username">Username</label>
          <div class="admin-input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="username" name="username" placeholder="Enter admin username" autocomplete="username" required>
          </div>
        </div>

        <div class="admin-form-group">
          <label for="password">Password</label>
          <div class="admin-input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" name="password" placeholder="Enter admin password" autocomplete="current-password" required>
            <button type="button" id="togglePassword" class="pw-toggle" aria-label="Show password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="admin-login-footer">
          <label class="remember-me">
            <input type="checkbox" id="remember">
            <span>Remember me</span>
          </label>
          <span class="hint-text">Locked out? Update ADMIN_PASSWORD in <code>.env</code></span>
        </div>

        <button type="submit" class="btn btn-primary btn-lg submit-btn" id="loginBtn" style="width: 100%;">
          <span class="spinner"></span>
          <span class="btn-text">
            Sign In
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 0.25rem;">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
          </span>
        </button>
      </form>

      <div class="admin-login-tips">
        <p>🔐 By signing in, you agree to process applicant data responsibly.</p>
        <p style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-muted);">All actions are session-protected and authenticated.</p>
      </div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
  <script>window.__ADMIN_VIEW = 'login';</script>
</body>
</html>
